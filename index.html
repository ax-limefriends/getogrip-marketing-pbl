<style>

ol.steps{list-style:none;padding:0;margin:8px 0 16px;counter-reset:s}

ol.steps li::before{content:counter(s);background:var(--teal);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
ol.steps li.done{background:var(--tealL)}
ol.steps label{display:flex;gap:12px;align-items:center;width:100%;cursor:pointer}
ol.steps input{width:18px;height:18px;accent-color:var(--teal);flex:none}
.who{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;margin-right:6px;white-space:nowrap}
.who.c{background:var(--goldL);color:#8a5a0b} .who.t{background:var(--tealL);color:#0b6f65} .who.b{background:var(--l1);color:var(--navy)}
.prompt{border:1px solid var(--l3);border-radius:10px;margin:14px 0;overflow:hidden}

.ph,.phx{background:var(--tealL);color:#0b6f65;font-weight:700;border-radius:4px;padding:0 3px}
.success{background:var(--tealL);border-radius:8px;padding:10px 14px;font-size:15px;margin:12px 0}

.stuck{background:var(--goldL);border-radius:8px;padding:10px 14px;font-size:15px;margin:12px 0}

figure.succ{margin:10px 0;border:1px solid var(--l3);border-radius:10px;overflow:hidden;background:#fff}
figure.succ img{display:block;max-width:100%;height:auto}
figure.succ figcaption{padding:8px 12px;font-size:13px;color:var(--gray);background:var(--l2)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px;margin:14px 0}
.card.fast{background:#F0F7FF;border-color:#BBD3F0} .card.fast .k{color:#2563EB}
.card.skip{background:var(--goldL);border-color:#F0D9A8} .card.skip .k{color:#B7791F}

.pnav a{flex:1;min-width:200px;text-decoration:none;border:1px solid var(--l3);border-radius:12px;padding:12px 16px;color:var(--ink);background:#fff}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px;margin:16px 0}

.form input,.form select,.form textarea,.tool input,.tool select,.tool textarea,.sbox input{width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--l3);border-radius:8px;font:inherit;background:#fff}

 .shell{display:block}

 aside{position:fixed;left:0;top:var(--top);width:min(86vw,320px);height:calc(100vh - var(--top));z-index:25;transform:translateX(-102%);transition:.2s;box-shadow:4px 0 18px rgba(0,0,0,.18)}
 body.menu aside{transform:none}

}

const CALC={
 expr(v){const t=v.text||'';const hits=RISK.filter(([w])=>t.includes(w));
  const len=t.replace(/\s/g,'').length;

  return {h:`주의 표현 ${hits.length}개 · 공백 제외 ${len}자<ul>${hits.map(([w,r])=>`<li><b>${esc(w)}</b> — ${esc(r)}</li>`).join('')}</ul>`,c:hits.length>2?'bad':'mid'}},
 title(v){const lines=(v.text||'').split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length)return {t:'상품명을 넣으세요',c:'mid'};

   const dup=Object.keys(cnt).filter(w=>cnt[w]>1);const risk=RISK.filter(([w])=>l.includes(w)).map(x=>x[0]);const brand=l.includes('게토그립');
   const issues=[];if(n>50)issues.push(`${n}자로 김(50자 안팎 권장)`);if(dup.length)issues.push('반복 단어: '+dup.join(', '));if(risk.length)issues.push('주의 표현: '+risk.join(', '));if(!brand)issues.push('브랜드명 없음');
   if(issues.length>1||risk.length)worst='bad';else if(issues.length&&worst==='good')worst='mid';

 cal(v){if(!v.start)return {t:'시작일을 넣으세요',c:'mid'};const s=new Date(v.start+'T00:00:00');const rows=[];let tot={blog:0,card:0,shorts:0,post:0};

 extra:`<div class="callout warn"><b>표현 주의</b><ul><li>일반 신발은 <b>질병 치료·예방</b>(족저근막염, 관절 등) 효능을 내세우지 않습니다. "피로회복"보다 "발의 피로 부담을 줄여 주는"처럼 씁니다.</li><li><b>최고·1위·100%·절대</b> 같은 표현은 객관적 근거가 없으면 쓰지 않습니다.</li><li>시험·특허·인증은 번호가 확인된 것만 씁니다. AI가 만든 수치는 지웁니다.</li><li><b>후기·별점은 실제 고객의 것만</b> 씁니다. AI가 지어낸 후기나 평점은 거짓 광고가 될 수 있습니다.</li></ul>세부 기준은 판매 채널 정책과 관련 법령을 따르며, 애매하면 빼는 쪽을 택합니다.</div>
 <div class="callout warn"><b>실제 사진 필수 (소비자 오인 방지)</b><ul><li>스마트스토어 <b>대표 이미지(목록 썸네일)</b>는 AI 이미지가 아니라 <b>실제 제품 사진</b>을 씁니다.</li><li>상세 페이지에서 <b>신발이 크게 나오는 장</b>(1 히어로, 4~6 Point, 8 디테일, 9 색상)은 실제 사진과 나란히 놓고 색·모양·무늬·구성품을 비교합니다. 다르면 그 장을 다시 만들거나 <b>실제 사진으로 바꿉니다</b>.</li><li>상세 페이지 아래 텍스트에 "일부 이미지는 AI로 만든 연출 이미지입니다. 제품 색상·형태는 실제 사진을 기준으로 확인해 주세요." 한 줄을 넣습니다.</li></ul></div>
 <details class="more"><summary>자세히 보기 · 상세 페이지 10장 구성</summary><div><div class="tw"><table><tr><th>장</th><th>섹션</th><th>내용</th></tr><tr><td>1</td><td>히어로</td><td>브랜드명 &lt; 메인카피 &lt; 제품명 순서의 크기 위계 + 감성 연출 사진</td></tr><tr><td>2</td><td>리뷰 / 추천 대상</td><td>실제 후기를 입력하면 후기 카드, 비워 두면 "이런 분께 추천해요"</td></tr><tr><td>3</td><td>3가지 핵심 가치</td><td>01 / 02 / 03 번호 카드 + 사진 + 한 줄 설명</td></tr><tr><td>4~6</td><td>Point 01~03</td><td>소구점 1~3을 큰 카피 + 짧은 설명 + 제품 사진으로 (장식 최소화)</td></tr><tr><td>7</td><td>비교</td><td>우리 제품 vs 일반 유사 제품 (과장 없이)</td></tr><tr><td>8</td><td>디테일</td><td>소재·마감·구조 등 디테일 2가지</td></tr><tr><td>9</td><td>색상·사이즈</td><td>입력한 옵션·사이즈만 (임의로 추가 금지)</td></tr><tr><td>10</td><td>제품 정보</td><td>치수도 + 스펙 표</td></tr></table></div></div></details>
 <details class="more"><summary>자세히 보기 · 스마트스토어 등록 (수업 후 과제)</summary><div><p>판매자센터 → 상품관리 → 상품 등록 → 상세설명에서 <b>스마트에디터</b>로 작성합니다. 대표 이미지는 실제 제품 사진으로 올리고, 10장을 순서대로 사진으로 추가한 뒤 그 아래에 옵션·사이즈·스펙과 AI 연출 이미지 안내 한 줄을 텍스트로 적어 둡니다. 텍스트는 검색에도 유리합니다. <b>HTML 붙여 넣기는 쓰지 않습니다</b>. 이미지는 가로 860px 안팎이 판매자들이 많이 쓰는 기준이며, 정확한 권장 크기는 판매자센터 도움말을 확인하세요.</p></div></details>`,
 steps:[`아래 안내 상자에서 <b>비어 있는 칸</b>이 없는지 보고, 옵션·사이즈·후기·디자인 스타일이 실제와 맞는지 <a href="#card">마스터 카드</a>에서 확인·수정합니다. (약 5분)`,
  `스킬을 불러온 대화창에서 프롬프트 A로 상품명·태그를 만들고 아래 <b>상품명 점검기</b>에 넣어 봅니다. (약 10분)`,
  `입력한 소구점과 상품명이 사실과 맞는지 확인하고 고친 뒤 승인합니다. 점심 후 첨부할 사진을 준비합니다: 제품 사진 여러 각도(정면·옆면·아웃솔·인솔·착용)와 참고할 다른 상세 페이지 캡처 1~2장 <span class="opt">선택사항</span>. (약 10분) <b>— 여기까지 하고 12:00 점심. 스킬 대화창은 닫지 말고 그대로 둡니다.</b>`,
  `점심 후 <b>'완성된 상세 페이지 프롬프트'</b>를 복사해, 같은 대화창에 사진과 함께 보냅니다. 10장이 차례로 만들어지고, 중간에 멈추면 <b>"이어서"</b>를 입력합니다. (약 25분)`,
  `10장에서 제품 색·모양·옵션이 실제와 같은지(<b>신발이 크게 나오는 장은 실제 사진과 나란히 놓고 비교</b>, 다르면 다시 만들거나 실제 사진으로 교체), 글자 오타, 지어낸 후기·숫자, Gemini로 만들었다면 모서리의 워터마크(✦)를 확인합니다. <code>page</code> 폴더에 <code>detail_01.png</code>~<code>detail_10.png</code>로 저장하고 워터마크는 잘라 냅니다. (약 10분)`],
 prompts:[{t:'A. 상품명·검색 태그',b:`{{channel}} 등록용으로 {{product}}의 ① 상품명 후보 3개(50자 안팎, 앞쪽에 핵심 키워드) ② 검색 태그 10개 ③ 고객이 검색창에 칠 만한 키워드 10개를 정리해 줘. 브랜드명 '게토그립'을 넣고, 같은 단어를 반복하지 말고, 최고·1위·100% 같은 과장 표현과 질병 관련 단어는 쓰지 마.`}],
 ok:'마스터 카드 값으로 상세 페이지 프롬프트가 완성되고, 상품명 후보 3개·태그 10개와 <code>page</code> 폴더의 상세 페이지 이미지 10장이 완성되었습니다. 사실과 표현을 확인했습니다.',
 tip:'AI 이미지는 한글 글자를 틀리게 넣거나 실제 제품에 없는 색·무늬·구성품을 지어 넣기도 합니다. 첨부 사진과 비교하고, 틀린 장만 "4장째 제목을 \'…\'로 고쳐 줘"처럼 다시 요청하세요. 글씨가 흐리면 이미지 메뉴에서 Pro 모델로 다시 만들기를 시도해 보세요.'},
{id:'m2',chat:'새 채팅을 열고 &#39;마스터 카드&#39; 스킬을 불러옵니다(Gemini는 입력창에 <b>/</b>, 안내가 뜨면 <b>@</b> · ChatGPT는 <b>/</b>). M1에서 만든 <b>상세 페이지 이미지 3~4장</b>(1장째 히어로, 4~6장째 Point)과 <b>실제 제품 사진 1장</b>을 함께 첨부하고 A를 보낸 뒤, <b>같은 대화창</b>에 이어서 B, C를 차례로 보냅니다. 이미지는 이미 대화에 있으므로 B·C에서 다시 첨부하지 않아도 됩니다.',tag:'M2 · 블로그·카드뉴스',title:'상세 페이지를 블로그 1편·카드뉴스 5장으로',time:'40분',clock:'13:35~14:15',
 intro:'M1에서 만든 <b>상세 페이지 이미지를 그대로 AI에게 보여 주고</b>, 그 내용으로 <b>네이버 블로그 1편</b>과 <b>인스타그램 카드뉴스 5장</b>을 만듭니다. 하나의 원본(상세 페이지)에서 문구와 디자인이 이어지므로 따로 설명하지 않아도 같은 톤이 나옵니다. 블로그 도입에는 마스터 카드의 <b>대표님 이야기</b>가 자동으로 들어갑니다.',
 extra:`<div class="two"><div class="card"><div class="k">블로그 · 정보형</div><h4>검색해서 들어오는 글</h4>"파크골프화 고르는 법"처럼 고객이 검색하는 질문에 답하고, 상세 페이지의 소구점을 정보 글로 풀어 마지막에 제품을 소개합니다.</div><div class="card"><div class="k">카드뉴스 · 공감형</div><h4>넘겨 보는 글</h4>1장 표지에서 멈추게 하고, 5장에서 "스마트스토어에서 게토그립 검색"으로 행동을 유도합니다. 디자인은 상세 페이지와 같은 톤으로 맞춥니다.</div></div>
 <div class="callout tip"><b>첨부할 때 주의</b><ul><li>상세 페이지 10장 전부보다 <b>3~4장</b>(히어로, Point 01~03)만 첨부합니다. 많을수록 AI가 덜 꼼꼼히 봅니다.</li><li>상세 페이지 속 신발도 AI가 그린 것이라 실제와 조금 다를 수 있습니다. 카드뉴스를 만들 때는 <b>실제 제품 사진</b>을 함께 첨부해 제품 모양의 기준으로 삼습니다.</li><li>숫자·옵션·사이즈는 이미지 속 글자가 아니라 <b>마스터 카드 값</b>을 씁니다. 이미지 글자에 오타가 있었다면 그대로 옮겨질 수 있기 때문입니다.</li><li><b>블로그 본문에는 상세 페이지 이미지를 넣지 않습니다.</b> 광고 배너처럼 보여 정보 글의 신뢰가 떨어집니다. 대신 프롬프트 B로 <b>블로그용 이미지 3장</b>(정보형 체크리스트 1장, 글자 없는 상황 장면 1장, <b>상세 페이지 속 신발을 활용한 제품 이미지 1장</b>)을 새로 만듭니다. 제품 이미지는 광고 문구·배지 없이 블로그 톤으로 다시 만든 것이라 정보 글에 어울립니다. AI 이미지에는 캡션에 '(AI로 만든 이미지)'를 붙입니다. <b>착용 모습은 실제 사진</b>을 쓰고, 고객 후기·착용 인증처럼 보이는 AI 사진은 만들지 않습니다.</li></ul></div>`,
 steps:[`마스터 카드 스킬을 불러온 새 채팅에 <b>상세 페이지 이미지 3~4장</b>과 <b>실제 제품 사진 1장</b>을 첨부하고 프롬프트 A를 보냅니다. 먼저 카드뉴스 문구 표가 나오고 이어서 1~5장 이미지가 만들어집니다. 문구 표에 고칠 곳이 있으면 "3장 제목을 '…'로 바꿔서 다시 만들어 줘"라고 요청합니다. 중간에 멈추면 <b>"이어서"</b>를 입력합니다. (약 13분)`,
  `같은 대화창에 이어서 프롬프트 B를 보내 <b>블로그용 이미지 3장</b>을 받습니다. 멈추면 "이어서"를 입력합니다. (약 9분)`,
  `같은 대화창에 이어서 프롬프트 C를 보내 <b>블로그 글 1편</b>을 받습니다. 글에는 B에서 만든 이미지 자리가 [AI 이미지 1~3]으로 표시됩니다. (약 5분)`,
  `블로그를 읽고 사실과 다른 곳을 짚습니다. 덧붙이고 싶은 경험이 있으면 "도입부에 '…' 문장을 넣어 줘"처럼 한 줄로 요청합니다. (약 5분)`,
  `블로그와 카드뉴스 문구가 사실과 맞는지, 이미지의 글자 오타와 제품 모양을 확인합니다. 결과물을 <code>blog</code> 폴더에 저장합니다. (약 8분)`],
 prompts:[{t:'A. 카드뉴스 5장 (상세 페이지 이미지 3~4장 + 실제 제품 사진 1장 첨부)',b:`첨부한 이미지는 우리 제품의 상세 페이지와 실제 제품 사진(마지막 1장)이야. 이걸로 인스타그램 카드뉴스 5장을 만들어 줘.

먼저 5장 문구를 표로 보여 줘.
- 열: 장 / 큰 제목(15자 이내) / 작은 설명(40자 이내) / 레이아웃(장마다 어떤 디자인으로 만들지)
- 구성: 1장 표지(질문형 훅) → 2장 고민 → 3장 해결 → 4장 제품 강점 → 5장 행동 유도({{channel}}에서 '게토그립' 검색)
- 해시태그 10개도 함께

표 바로 뒤에 1장부터 5장까지 이미지를 차례로 만들어 줘. 중간에 멈추면 내가 '이어서'라고 할 때 다음 장부터 만들어 줘.

[디자인]
- 세로형 4:5, 첨부한 상세 페이지와 같은 색·폰트·분위기 (색상 팔레트: {{pal}} / 폰트: {{font}})
- 큰 제목은 크게, 표의 문구를 한 글자도 바꾸지 말고 한글로 정확하게
- 중요한 글자는 위아래 끝을 피해 가운데 쪽에 (프로필 격자에서 잘리지 않게)
- 5장은 색·폰트만 통일하고, 레이아웃은 장마다 다르게 해 줘
  (사진 중심 / 큰 글자 중심 / 아이콘·목록 / 제품 클로즈업 / 여백 많은 한 줄 문구 등)
- 각 장은 앞 장 이미지를 고치지 말고 새로 만들어 줘
- 장 번호·구성 이름(표지, 고민 등)·레이아웃 이름은 이미지에 글자로 넣지 마
- 로고·워터마크·다른 글자는 넣지 마

[사진]
- 제품 모양과 색은 첨부한 실제 제품 사진 기준으로 바꾸지 마
- 1장 표지는 상세 페이지 히어로 이미지를 그대로 활용해도 좋아
- 4장은 실제 제품 사진을 크게
- 숫자·옵션은 마스터 카드 값만 써 줘`},
  {t:'B. 블로그용 이미지 3장 (같은 대화창)',b:`위에 첨부한 상세 페이지 내용을 재료로만 참고해서, 마스터 카드 기준으로 네이버 블로그 글 '{{target}}이 신발을 고를 때 꼭 보는 3가지'에 넣을 블로그용 이미지 3장을 만들어 줘. 상세 페이지 이미지는 블로그에 그대로 쓰지 않을 거야.
- 가로형(4:3), 차분한 정보 글 톤, 상세 페이지·카드뉴스의 광고 문구·배지·디자인은 쓰지 마
- 이미지 1: '신발 고를 때 꼭 보는 3가지'를 정리한 정보형 체크리스트 그림 (상세 페이지의 소구점 3가지를 바탕으로, 글자는 짧게, 한글 정확하게)
- 이미지 2: 도입부 상황 장면 (예: 이슬 맺힌 잔디 파크골프장, 사람의 발과 신발이 작게 보이는 정도) — 이미지 안에 글자 없음
- 이미지 3: 제품 이미지 — 상세 페이지 속 신발을 활용해 블로그에 어울리는 깔끔한 제품 컷으로 (자연광, 잔디나 단순한 배경), 광고 문구·배지 없이 이미지 안에 글자 없음
- 신발 모양과 색은 첨부한 실제 제품 사진과 상세 페이지 속 신발 그대로, 바꾸지 마
- 사람이 신고 찍은 듯한 사진, 고객 후기·착용 인증처럼 보이는 장면은 만들지 마 (착용 모습은 실제 사진으로 채울 거야)

  `프롬프트 B로 '추가 사용 규칙'을 만들어 B 바로 아래 칸에 붙여 넣고 <b>마스터 카드에 넣고 다른 이름으로 저장(.md)</b>을 누릅니다. 저장한 .md로 스킬을 새 내용으로 바꿉니다(Gemini: 맞춤설정 → 스킬에서 지침 교체 / ChatGPT: /skill-creator에 새 .md 첨부). 새 채팅에서 새 주제 하나로 블로그 초안이 바로 나오는지 시험합니다. (약 10분)`,
  `<a href="#check">점검표</a>의 <b>결과물 평가 기준</b>으로 스스로 채점하고, <a href="#notes">내 결과 노트</a>에 블록별 시간과 <b>회고 한 줄</b>을 적은 뒤 프롬프트 C로 3분 발표 개요를 만들어 발표합니다. (약 12분)`,
  `<a href="#check">점검표·마무리</a>에서 최종 산출물과 표현 점검을 체크합니다. (약 5분)`],
 prompts:[{t:'A. 4주 콘텐츠 주제표',b:`{{company}}의 4주 콘텐츠 주제를 표로 짜 줘.

  {t:'B. 마스터 카드 추가 사용 규칙',b:`오늘 아래 방식으로 콘텐츠를 만들었어. 다음에도 같은 품질로 반복할 수 있게, 마스터 카드 스킬의 '사용 방법'에 덧붙일 규칙으로 줄여 줘.

- 상세 페이지: 제품 정보와 디자인 스타일로 세로 4:5 섹션 이미지 10장(섹션 이름은 이미지에 넣지 않기, 후기·별점은 실제 후기가 있을 때만) + 상품명 후보 3개·검색 태그 10개

- 쇼츠: 주제 5개 → 15초 스토리보드(훅 0~3초 / 핵심 정보 3~11초 / 행동 유도 11~15초) → 구글 Flow에 붙여 넣을 15초 한글 프롬프트 1개 → 업로드 문구

[규칙 쓰는 방법]

- 각 줄은 '- '로 시작하고, 전체 10줄 이내
- 브랜드 정보와 금지 표현은 마스터 카드에 이미 있으니 반복하지 마`},

function qtParse(text){const o={};String(text||'').split('\n').forEach(line=>{

8. 마케팅 활용 구분 표 (써도 되는 사실 / 확인 후 사용 / 쓰지 않음)
9. 확인 필요 사항과 다음 조치 표 (열: 항목 / 확인할 내용 / 담당 / 기한 — 담당·기한은 빈칸으로)
10. 결론: 2~3줄

[규칙]
- 숫자는 자료에 있는 값만 그대로 쓰고, 새로 계산하거나 바꾸지 마
- 자료에 없는 사실(시험 결과·인증·성능 수치)은 만들지 말고 '확인 필요'로 써
- 보고서 문체(~함, ~임)로 짧고 분명하게
- 교육용 가상 견적서라는 점을 보고 개요에 한 줄 적어 줘

[견적 검토 자료]
${qtReport(d)}`}
function qtBoxHTML(){const q=LS.get('qt',{});
 return `<div class="prompt persbox"><div class="prompt-h"><b>A 결과 붙여 넣기 → 프롬프트 B 자동 완성 (원가는 교안이 계산)</b><span class="pbtns"><span id="qtmsg" class="score"></span><button class="btn teal sm" id="qtApply">프롬프트 B 만들기</button></span></div><textarea id="qtin" spellcheck="false" placeholder="프롬프트 A 결과(품목: … / 갑피 소재: … 형식)를 여기에 붙여 넣으세요">${esc(q.raw||'')}</textarea></div>
 <div class="prompt"><div class="prompt-h"><b>B. 결과보고서 문서 만들기 (A와 같은 대화창에 보내기)</b><span class="pbtns"><button class="btn teal sm" data-copy="qtrep">복사</button></span></div><pre id="qtrep">${esc(q.rep||'아직 만들지 않았습니다. 위 칸에 A 결과를 붙여 넣고 [프롬프트 B 만들기]를 누르면 견적 데이터와 원가 계산이 들어간 프롬프트가 여기에 완성됩니다.')}</pre></div>`}
function dlText(text,name,type){const b=new Blob(['﻿'+text],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ───────── 라우터 ───────── */
function route(){
  let id=decodeURIComponent(location.hash.replace('#',''))||'home';
  const day=DAYS.find(d=>d.id===id);
  let html;
  if(id==='home')html=viewHome();else if(id==='prep')html=viewPrep();else if(id==='card')html=viewCard();
  else if(id==='tools')html=viewTools();else if(id==='notes')html=viewNotes();else if(id==='check')html=viewCheck();
  else if(day)html=viewDay(day);else if(SBY[id]){html=viewSession(SBY[id]);LS.set('last',id)}
  else{id='home';html=viewHome()}
  CUR=id;$('main').innerHTML=html;document.body.classList.remove('menu');
  renderSide();updateTop();initTools();applyPh();initPrompts();dpRender();
  if(SBY[id])loadSuccessImg(SBY[id]);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ───────── 이벤트 (위임) ───────── */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.step){const d=LS.get('steps',{});d[t.dataset.step]=t.checked;LS.set('steps',d);t.closest('li').classList.toggle('done',t.checked);
    const s=SBY[CUR];if(s){const q=sessProg(s);const sp=$('sessprog');if(sp)sp.textContent=`${s.time} · 따라 하기 ${q.d}/${q.n}`}renderSide();updateTop()}
  else if(t.dataset.prep){const d=LS.get('prep',{});d[t.dataset.prep]=t.checked;LS.set('prep',d);t.closest('.pc').classList.toggle('done',t.checked);
    const n=prepCount();$('preptxt').textContent=`${n} / ${PREP.length}`;$('prepfill').style.width=Math.round(n/PREP.length*100)+'%';renderSide();updateTop()}
  else if(t.dataset.ck){const [k,i]=t.dataset.ck.split('-');const s=LS.get('ck-'+k,{});s[i]=t.checked;LS.set('ck-'+k,s);
    $('sc-'+k).textContent=`${CK[k].filter((_,j)=>s[j]).length} / ${CK[k].length}`;updateTop()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.n!==undefined){const n=noteVals();n[t.dataset.n]=t.value;LS.set('notes',n);const ns=$('notesum');if(ns)ns.textContent=noteSummary()}
  else if(t.dataset.dp!==undefined){const s=LS.get('dp',{});s[t.dataset.dp]=t.value;LS.set('dp',s);dpRender()}
  else if(t.id==='psearch'){const q=t.value.trim().toLowerCase();let c=0;document.querySelectorAll('#plist details').forEach(d=>{const ok=!q||d.dataset.q.includes(q);d.style.display=ok?'':'none';if(ok)c++});$('pnone').style.display=c?'none':''}
  else if(t.classList.contains('pedit')){const key=t.dataset.pk;const pe=PE.get();const orig=plain(PROMPTS[key]);if(t.value===orig)delete pe[key];else pe[key]=t.value;PE.set(pe);fitTA(t);markMod(t,orig);
    document.querySelectorAll(`textarea.pedit[data-pk="${key}"]`).forEach(o=>{if(o!==t){o.value=t.value;fitTA(o);markMod(o,orig)}})}
});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
function fb(t,done){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('복사 실패: 직접 선택해 복사하세요')}a.remove()}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');
  if(c){const el=$(c.dataset.copy);if(!el)return;const txt=el.tagName==='TEXTAREA'?el.value:el.textContent;const done=()=>toast('복사됐습니다');
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,()=>fb(txt,done))}else fb(txt,done);return}
  const r=e.target.closest('[data-reset]');
  if(r){const ta=$(r.dataset.reset);if(!ta)return;const key=ta.dataset.pk;const pe=PE.get();delete pe[key];PE.set(pe);const orig=plain(PROMPTS[key]);
    document.querySelectorAll(`textarea.pedit[data-pk="${key}"]`).forEach(o=>{o.value=orig;fitTA(o);markMod(o,orig)});toast('원래 프롬프트로 되돌렸습니다');return}
  const rb=e.target.closest('[data-rst]');
  if(rb){const o=RST[rb.dataset.rst];if(o&&confirm(o.q)){o.f();if(rb.dataset.rst==='all'&&location.hash!=='#home'){location.hash='#home'}else route();toast(o.m)}return}
  const id=e.target.id;
  if(id==='dpLoad'){const s=LS.get('dp',{});['brand','name','s1','s2','s3'].forEach(k=>delete s[k]);LS.set('dp',s);route();toast('마스터 카드 값을 다시 불러왔습니다');return}
  if(id==='dpReset'){if(confirm('상세 페이지 입력 칸을 모두 처음 상태로 되돌릴까요?')){LS.set('dp',{});route();toast('입력 칸을 초기화했습니다')}return}
  if(id==='menuBtn'){document.body.classList.toggle('menu');return}
  if(id==='applyCard'){const vals={};document.querySelectorAll('#cardform [data-f]').forEach(x=>{vals[x.dataset.f]=x.value.trim()});LS.set('card',vals);applyPh();initPrompts();const a=$('applied');a.textContent='✔ 적용했습니다';setTimeout(()=>a.textContent='',2500);return}
  if(id==='dlCard'){saveCardMd();return}
  if(id==='qtDocDl'){dlText(QUOTE,'가상_OEM_견적서_GP-200.txt','text/plain');return}
  if(id==='qtApply'){const raw=$('qtin').value.trim();if(!raw){toast('A 결과를 먼저 붙여 넣으세요');return}
    const d=qtParse(raw);if(Object.keys(d).length<3){toast('형식을 읽지 못했습니다. "항목: 값" 형식인지 확인하세요');return}
    const rep=qtPrompt(d);LS.set('qt',{raw,rep});$('qtrep').textContent=rep;
    $('qtmsg').textContent=`✔ ${Object.keys(d).length}개 항목을 읽었습니다`;toast('프롬프트 B를 만들었습니다');return}
  const cs=e.target.closest('[data-cardsave]');if(cs){const k=cs.dataset.cardsave;const v=$('box-'+k).value.trim();if(!v){toast('결과를 먼저 붙여 넣으세요');return}const c=LS.get('card',{});c[k]=v;LS.set('card',c);applyPh();initPrompts();const a=$('saved-'+k);if(a)a.textContent='✔ 마스터 카드에 넣었습니다';saveCardMd();return}
  if(id==='dlCardOld'){const b=new Blob([cardMd(cardVals())],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='게토그립_프로젝트카드.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
  if(id==='dlNotes'){const b=new Blob(['﻿'+noteSummary()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='게토그립_마케팅PBL_결과요약.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
  if(document.body.classList.contains('menu')&&e.target.closest('aside a'))document.body.classList.remove('menu');
});
route();
</script>
